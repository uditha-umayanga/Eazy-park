<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EAZYPARK — Smart parking system</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    @keyframes dash {
      to { stroke-dashoffset: -32; }
    }
    .animate-route {
      animation: dash 1s linear infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 12px rgba(59, 130, 246, 0.45); }
      50% { box-shadow: 0 0 24px rgba(59, 130, 246, 0.85); }
    }
    .glow-selected {
      animation: pulseGlow 2s infinite;
    }
  </style>
</head>
<body class="bg-[#070B14] text-slate-100 min-h-screen w-full overflow-x-hidden selection:bg-cyan-500 selection:text-white">
  <div id="root" class="w-full min-h-screen"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const CarGraphic = ({ color = "#ef4444", plate = "" }) => (
      <div className="flex flex-col items-center justify-center w-full h-full leading-none pointer-events-none">
        <svg viewBox="0 0 100 46" className="w-16 h-7 drop-shadow">
          <rect x="16" y="2" width="16" height="5" rx="2" fill="#0f172a" />
          <rect x="66" y="2" width="16" height="5" rx="2" fill="#0f172a" />
          <rect x="16" y="39" width="16" height="5" rx="2" fill="#0f172a" />
          <rect x="66" y="39" width="16" height="5" rx="2" fill="#0f172a" />
          <rect x="8" y="6" width="84" height="34" rx="10" fill={color} />
          <path d="M28 10 L38 10 L35 36 L28 36 Z" fill="#0f172a" opacity="0.8" />
          <path d="M62 10 L74 10 L74 36 L62 36 Z" fill="#0f172a" opacity="0.85" />
          <rect x="39" y="10" width="22" height="26" rx="4" fill="#ffffff" opacity="0.2" />
          <circle cx="90" cy="12" r="2.5" fill="#fef08a" />
          <circle cx="90" cy="34" r="2.5" fill="#fef08a" />
        </svg>
        {plate && (
          <span className="mt-1 px-1.5 py-0.5 bg-black/80 rounded text-[9px] font-mono font-bold text-white truncate max-w-full">
            {plate}
          </span>
        )}
      </div>
    );

    const ALL_SLOT_IDS = ["S1", "S2", "S3", "S4", "S5", "S6", "S7", "S8", "S9", "S10"];
    const LEFT_IDS = ["S1", "S2", "S3", "S4", "S5"];
    const RIGHT_IDS = ["S6", "S7", "S8", "S9", "S10"];

    function App() {
      const [tab, setTab] = useState("driver");
      const [slots, setSlots] = useState({});
      const [vehicles, setVehicles] = useState({});
      const [latestScan, setLatestScan] = useState(null);
      const [myPlate, setMyPlate] = useState("");
      const [pendingSlot, setPendingSlot] = useState(null);
      const [alerts, setAlerts] = useState([]);
      const [activePopup, setActivePopup] = useState(null);
      const [billModal, setBillModal] = useState(null);
      const [liveTimer, setLiveTimer] = useState(0);
      const notifiedExitRef = useRef("");

      const [simPlate, setSimPlate] = useState("WP CAB-1234");
      const [simType, setSimType] = useState("Car");
      const [simSlot, setSimSlot] = useState("S1");
      const [simActualPlate, setSimActualPlate] = useState("WP CAB-1234");

      const API_BASE = window.location.origin;

      const triggerExitSystemNotification = (vehicle) => {
        if (!vehicle || notifiedExitRef.current === `${vehicle.plate}_${vehicle.exit_time_str}`) return;
        notifiedExitRef.current = `${vehicle.plate}_${vehicle.exit_time_str}`;

        if ("serviceWorker" in navigator && Notification.permission === "granted") {
          navigator.serviceWorker.ready.then((reg) => {
            if (reg.active) {
              reg.active.postMessage({
                type: "SHOW_EXIT_BILL",
                plate: vehicle.plate,
                duration: vehicle.duration_sec,
                bill: vehicle.bill.toFixed(2)
              });
            }
          });
        } else if ("Notification" in window && Notification.permission === "granted") {
          new Notification("Thank you for using our service! 🚘", {
            body: `Vehicle: ${vehicle.plate} | Duration: ${vehicle.duration_sec}s | Total Bill: LKR ${vehicle.bill.toFixed(2)}`
          });
        }
      };

      useEffect(() => {
        if ("Notification" in window && Notification.permission !== "granted") {
          Notification.requestPermission();
        }
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("/sw.js").catch(console.error);
        }
      }, []);

      useEffect(() => {
        const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === "STATE_UPDATE") {
            setSlots(msg.slots || {});
            setVehicles(msg.vehicles || {});
            setLatestScan(msg.latest_gate_scan);
            setAlerts(msg.alerts || []);
          } else if (msg.type === "ALERT") {
            setActivePopup(msg.alert);
          } else if (msg.type === "BILL_GENERATED") {
            setBillModal(msg.vehicle);
            triggerExitSystemNotification(msg.vehicle);
          }
        };

        const syncInterval = setInterval(async () => {
          try {
            const res = await fetch(`${API_BASE}/api/state`);
            if (res.ok) {
              const data = await res.json();
              setSlots(data.slots || {});
              setVehicles(data.vehicles || {});
              setLatestScan(data.latest_gate_scan);
              setAlerts(data.alerts || []);
            }
          } catch (e) {}
        }, 1500);

        return () => {
          ws.close();
          clearInterval(syncInterval);
        };
      }, []);

      const myVehicle = myPlate ? vehicles[myPlate] : null;
      const alreadyHasSlot = Boolean(myVehicle && myVehicle.slot_id);

      useEffect(() => {
        if (myVehicle && myVehicle.slot_id) {
          setPendingSlot(null);
        }
      }, [myVehicle]);

      useEffect(() => {
        if (myVehicle && myVehicle.status === "EXITED" && myVehicle.bill !== undefined) {
          setBillModal(myVehicle);
          triggerExitSystemNotification(myVehicle);
        }
      }, [myVehicle]);

      useEffect(() => {
        if (!myVehicle || myVehicle.status === "EXITED") return;
        const interval = setInterval(() => {
          const secs = Math.max(0, Math.floor(Date.now() / 1000 - myVehicle.entry_time));
          setLiveTimer(secs);
        }, 1000);
        return () => clearInterval(interval);
      }, [myVehicle]);

      const stats = useMemo(() => {
        const list = Object.values(slots);
        const total = list.length || 10;
        const available = list.filter((s) => s.status === "available").length;
        const occupied = list.filter((s) => s.status === "occupied").length;
        const reserved = list.filter((s) => s.status === "reserved").length;
        return { total, available, occupied, reserved };
      }, [slots]);

      const postApi = async (endpoint, body) => {
        const res = await fetch(`${API_BASE}${endpoint}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        return res.json();
      };

      const handleConfirmVehicle = async (plate, vehicle_type) => {
        if (!plate.trim()) return;
        await postApi("/api/gate/confirm", { plate, vehicle_type });
        setMyPlate(plate.toUpperCase().trim());
        setPendingSlot(null);
      };

      const handlePickSlot = (slotId) => {
        if (!myPlate) {
          alert("Please confirm your vehicle at the Entry Gate first!");
          return;
        }
        if (alreadyHasSlot) {
          alert(`You already selected slot ${myVehicle.slot_id}. Only 1 slot is allowed per vehicle!`);
          return;
        }
        const s = slots[slotId] || { id: slotId, status: "available" };
        if (s.status !== "available") return;
        setPendingSlot(slotId);
      };

      const handleConfirmSlotOk = async () => {
        if (!myPlate || !pendingSlot || alreadyHasSlot) return;
        const res = await postApi("/api/slots/select", { plate: myPlate, slot_id: pendingSlot });
        if (res && res.error) {
          alert(res.error);
          setPendingSlot(null);
        } else {
          setPendingSlot(null);
        }
      };

      const handleUnlock = async () => {
        if (!myPlate) return;
        await postApi("/api/vehicle/unlock", { plate: myPlate });
      };

      // Accurate Navigation Line for 5 Rows per Wing (S1-S5 Left, S6-S10 Right)
      const renderNavigationPath = () => {
        if (!myVehicle || !myVehicle.slot_id) return null;
        const num = parseInt(myVehicle.slot_id.replace("S", ""), 10);
        if (isNaN(num) || num < 1 || num > 10) return null;

        const isReturning = myVehicle.status === "UNLOCKED";
        const strokeColor = isReturning ? "#c084fc" : "#22d3ee";

        const isLeft = num <= 5;
        const row = (num - 1) % 5; // 0..4
        const targetY = 48 + row * 96; // Exact vertical center of each of the 5 rows
        const targetX = isLeft ? 75 : 325;

        const pathData = !isReturning
          ? `M 35 16 L 200 16 L 200 ${targetY} L ${targetX} ${targetY}`
          : `M 200 464 L 200 ${targetY} L ${targetX} ${targetY}`;

        return (
          <g>
            <path
              d={pathData}
              fill="none"
              stroke={strokeColor}
              strokeWidth="10"
              strokeOpacity="0.25"
              strokeLinecap="round"
              strokeLinejoin="round"
            />
            <path
              d={pathData}
              fill="none"
              stroke={strokeColor}
              strokeWidth="4"
              strokeDasharray="10 6"
              strokeLinecap="round"
              strokeLinejoin="round"
              className="animate-route"
            />
            <circle cx={targetX} cy={targetY} r="7" fill={strokeColor} />
            <circle cx={targetX} cy={targetY} r="13" fill="none" stroke={strokeColor} strokeWidth="2.5" opacity="0.7" />
          </g>
        );
      };

      const formatDuration = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m}m ${s}s`;
      };

      const renderSlotCard = (slotId) => {
        const slot = slots[slotId] || { id: slotId, status: "available" };
        const isMine = myVehicle && myVehicle.slot_id === slotId;
        const isPending = pendingSlot === slotId;
        const isFree = slot.status === "available";
        const isReserved = slot.status === "reserved";
        const isOccupied = slot.status === "occupied";

        const canClickFree = isFree && !alreadyHasSlot;

        return (
          <button
            type="button"
            key={slotId}
            onClick={() => canClickFree && handlePickSlot(slotId)}
            disabled={!canClickFree && !isMine && !isPending}
            className={`relative z-30 h-20 w-full text-left rounded-xl border-2 px-3.5 py-2.5 transition-all flex flex-col justify-between overflow-hidden ${
              isMine
                ? "bg-blue-950/85 border-blue-400 glow-selected"
                : isPending
                ? "bg-cyan-950/90 border-cyan-300 ring-2 ring-cyan-400 cursor-pointer scale-[1.02]"
                : canClickFree
                ? "bg-emerald-950/35 border-emerald-500/45 hover:border-emerald-300 hover:bg-emerald-900/50 cursor-pointer active:scale-95"
                : isReserved
                ? "bg-amber-950/40 border-amber-500/50 cursor-not-allowed"
                : isOccupied
                ? "bg-rose-950/40 border-rose-500/50 cursor-not-allowed"
                : "bg-slate-900/60 border-slate-700/60 opacity-75 cursor-not-allowed"
            }`}
          >
            <div className="flex justify-between items-center w-full pointer-events-none">
              <span className="text-sm font-black text-white leading-none">{slotId}</span>
              <span
                className={`w-2.5 h-2.5 rounded-full ${
                  isMine
                    ? "bg-blue-400"
                    : isPending
                    ? "bg-cyan-300 animate-ping"
                    : isFree
                    ? "bg-emerald-400 shadow-[0_0_8px_#34d399]"
                    : isReserved
                    ? "bg-amber-400"
                    : "bg-rose-500 shadow-[0_0_8px_#f43f5e]"
                }`}
              ></span>
            </div>

            {isOccupied ? (
              <CarGraphic
                color={isMine ? "#3b82f6" : "#ef4444"}
                plate={slot.actual_plate || slot.reserved_by}
              />
            ) : (
              <div className="text-center my-auto w-full leading-none pointer-events-none">
                <span
                  className={`text-xs font-extrabold uppercase tracking-wider block ${
                    isMine
                      ? "text-blue-300"
                      : isPending
                      ? "text-cyan-200"
                      : isFree
                      ? "text-emerald-400"
                      : "text-amber-300"
                  }`}
                >
                  {isMine ? "YOUR BAY" : isPending ? "SELECTED (PRESS OK)" : isFree ? "AVAILABLE" : "RESERVED"}
                </span>
                {slot.reserved_by && (
                  <div className="text-[10px] font-mono text-slate-300 truncate mt-1">
                    {slot.reserved_by}
                  </div>
                )}
              </div>
            )}
          </button>
        );
      };

      return (
        <div className="w-full min-h-screen px-4 sm:px-6 lg:px-10 py-5 flex flex-col justify-between">
          <div className="w-full">
            {/* Top Glass Navigation Bar */}
            <header className="w-full flex flex-wrap items-center justify-between gap-4 bg-slate-900/75 backdrop-blur-xl border border-slate-800/80 rounded-2xl px-6 py-4 mb-6 shadow-2xl">
              <div className="flex items-center gap-4">
                <img
                  src="/logo.png"
                  alt="EAZYPARK Logo"
                  className="h-14 w-auto object-contain"
                />

                <div>
                  <div className="flex items-center gap-2.5">
                    <h1 className="text-2xl font-extrabold tracking-wide bg-gradient-to-r from-cyan-300 via-white to-blue-300 bg-clip-text text-transparent">
                      EAZYPARK
                    </h1>
                    <span className="flex items-center gap-1.5 px-2.5 py-0.5 text-[11px] font-bold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-full">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                      Live
                    </span>
                  </div>
                  <p className="text-xs sm:text-sm text-slate-400 font-medium">Smart parking system</p>
                </div>
              </div>

              <div className="flex gap-2 bg-slate-950/90 p-1.5 rounded-xl border border-slate-800">
                <button
                  onClick={() => setTab("driver")}
                  className={`px-5 py-2.5 rounded-lg text-xs sm:text-sm font-bold transition-all ${
                    tab === "driver"
                      ? "bg-gradient-to-r from-cyan-600 to-blue-600 text-white shadow-md"
                      : "text-slate-400 hover:text-white"
                  }`}
                >
                  🚘 Driver Portal
                </button>
                <button
                  onClick={() => setTab("admin")}
                  className={`px-5 py-2.5 rounded-lg text-xs sm:text-sm font-bold transition-all ${
                    tab === "admin"
                      ? "bg-gradient-to-r from-amber-500 to-orange-600 text-white shadow-md"
                      : "text-slate-400 hover:text-white"
                  }`}
                >
                  🎛️ Sensor & Camera Sim
                </button>
              </div>
            </header>

            {/* Live Telemetry Summary Bar */}
            <div className="w-full grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              <div className="bg-slate-900/65 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between shadow-lg">
                <div>
                  <p className="text-xs text-slate-400 font-medium">Total Capacity</p>
                  <p className="text-3xl font-extrabold text-white mt-1">{stats.total} <span className="text-xs font-normal text-slate-500">Bays</span></p>
                </div>
                <div className="w-11 h-11 rounded-xl bg-slate-800 flex items-center justify-center text-xl text-slate-300 font-bold">🏢</div>
              </div>
              <div className="bg-emerald-950/25 border border-emerald-500/30 rounded-2xl p-4 flex items-center justify-between shadow-lg">
                <div>
                  <p className="text-xs text-emerald-400 font-medium">Available Now</p>
                  <p className="text-3xl font-extrabold text-emerald-400 mt-1">{stats.available}</p>
                </div>
                <div className="w-11 h-11 rounded-xl bg-emerald-500/10 flex items-center justify-center text-xl text-emerald-400 font-bold">✅</div>
              </div>
              <div className="bg-amber-950/25 border border-amber-500/30 rounded-2xl p-4 flex items-center justify-between shadow-lg">
                <div>
                  <p className="text-xs text-amber-400 font-medium">Reserved / En-route</p>
                  <p className="text-3xl font-extrabold text-amber-400 mt-1">{stats.reserved}</p>
                </div>
                <div className="w-11 h-11 rounded-xl bg-amber-500/10 flex items-center justify-center text-xl text-amber-400 font-bold">🧭</div>
              </div>
              <div className="bg-rose-950/25 border border-rose-500/30 rounded-2xl p-4 flex items-center justify-between shadow-lg">
                <div>
                  <p className="text-xs text-rose-400 font-medium">Occupied Bays</p>
                  <p className="text-3xl font-extrabold text-rose-400 mt-1">{stats.occupied}</p>
                </div>
                <div className="w-11 h-11 rounded-xl bg-rose-500/10 flex items-center justify-center text-xl text-rose-400 font-bold">🚘</div>
              </div>
            </div>

            {/* Security / Wrong Slot Alert Banner */}
            {activePopup && (
              <div
                className={`mb-6 p-4 rounded-2xl border backdrop-blur-md flex justify-between items-center shadow-2xl ${
                  activePopup.level === "CRITICAL"
                    ? "bg-red-950/90 border-red-500 text-red-100"
                    : "bg-amber-950/90 border-amber-500 text-amber-100"
                }`}
              >
                <div className="flex items-start gap-3">
                  <span className="text-2xl">{activePopup.level === "CRITICAL" ? "🚨" : "⚠️"}</span>
                  <div>
                    <div className="font-extrabold text-sm tracking-wide uppercase">{activePopup.title}</div>
                    <p className="text-xs sm:text-sm opacity-90 mt-0.5">{activePopup.message}</p>
                  </div>
                </div>
                <button
                  onClick={() => setActivePopup(null)}
                  className="text-xs font-bold bg-black/40 hover:bg-black/60 px-3 py-1.5 rounded-lg border border-white/10"
                >
                  Dismiss
                </button>
              </div>
            )}

            {/* Exit Receipt Modal */}
            {billModal && (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-slate-900 border border-cyan-500/50 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">
                  <div className="w-12 h-12 rounded-2xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-2xl mx-auto mb-3">
                    🧾
                  </div>
                  <h2 className="text-xl font-extrabold text-white">Thank you for using our service!</h2>
                  <p className="text-slate-400 text-xs mt-1 mb-5">Automated Gate Exit & Payment Receipt</p>
                  <div className="bg-slate-950/90 border border-slate-800 rounded-2xl p-4 text-left space-y-2.5 text-sm mb-6">
                    <div className="flex justify-between">
                      <span className="text-slate-400">Vehicle Plate:</span>
                      <span className="font-mono font-bold text-cyan-300">{billModal.plate}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Entry Time:</span>
                      <span>{billModal.entry_time_str}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Exit Time:</span>
                      <span>{billModal.exit_time_str}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Total Stay:</span>
                      <span>{billModal.duration_sec} secs</span>
                    </div>
                    <div className="flex justify-between border-t border-slate-800 pt-3 text-base font-extrabold text-emerald-400">
                      <span>Amount Due:</span>
                      <span>LKR {billModal.bill.toFixed(2)}</span>
                    </div>
                  </div>
                  <button
                    onClick={() => {
                      setBillModal(null);
                      setMyPlate("");
                      setPendingSlot(null);
                    }}
                    className="w-full py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 rounded-xl font-bold text-white shadow-lg"
                  >
                    Confirm Payment & Exit
                  </button>
                </div>
              </div>
            )}

            {/* DRIVER VIEW */}
            {tab === "driver" && (
              <div className="w-full grid lg:grid-cols-12 gap-6 items-stretch">
                {/* Left 4 Columns: Driver Controls */}
                <div className="lg:col-span-4 flex flex-col justify-between space-y-5">
                  {!myVehicle || myVehicle.status === "EXITED" ? (
                    <div className="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 shadow-xl h-full flex flex-col justify-center">
                      <div className="flex items-center gap-2 text-xs font-bold text-cyan-400 uppercase tracking-wider mb-4">
                        <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
                        Step 1: Gate ALPR Verification
                      </div>

                      {latestScan && !latestScan.confirmed ? (
                        <div className="bg-gradient-to-b from-slate-950 to-slate-900 border border-cyan-500/40 rounded-2xl p-6 text-center">
                          <p className="text-xs text-slate-400 mb-3">Entry Camera Recognized:</p>
                          <div className="inline-block bg-amber-400 text-slate-950 font-mono font-black text-3xl px-5 py-2 rounded-xl border-2 border-slate-900 shadow-md tracking-widest">
                            {latestScan.plate}
                          </div>
                          <div className="mt-3 text-xs text-cyan-300 font-semibold">
                            Detected Class: {latestScan.vehicle_type}
                          </div>
                          <button
                            onClick={() =>
                              handleConfirmVehicle(latestScan.plate, latestScan.vehicle_type)
                            }
                            className="mt-6 w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 rounded-xl font-extrabold text-sm text-white shadow-lg shadow-emerald-600/20 transition-all"
                          >
                            ✓ Confirm Vehicle & Open Barrier
                          </button>
                        </div>
                      ) : (
                        <div className="bg-slate-950/80 border border-slate-800/80 rounded-2xl p-6">
                          <p className="text-sm text-slate-400 leading-relaxed">
                            Approach the Entry Barrier for automatic plate recognition, or enter your vehicle number below to test:
                          </p>
                          <div className="mt-5 flex gap-2.5">
                            <input
                              type="text"
                              placeholder="e.g. WP CAB-1234"
                              value={simPlate}
                              onChange={(e) => setSimPlate(e.target.value)}
                              className="bg-slate-900 border border-slate-700 focus:border-cyan-500 outline-none rounded-xl px-4 py-3 text-sm font-mono w-full"
                            />
                            <button
                              onClick={() => handleConfirmVehicle(simPlate, "Car")}
                              className="bg-cyan-600 hover:bg-cyan-500 px-5 py-3 rounded-xl text-sm font-bold whitespace-nowrap"
                            >
                              Enter
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 space-y-5 shadow-xl h-full flex flex-col justify-between">
                      <div className="space-y-5">
                        <div className="flex justify-between items-start border-b border-slate-800 pb-4">
                          <div>
                            <span className="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">
                              Digital Parking Pass
                            </span>
                            <div className="mt-1.5 inline-block bg-amber-400 text-slate-950 font-mono font-black text-xl px-3.5 py-1 rounded-lg tracking-wider">
                              {myVehicle.plate}
                            </div>
                          </div>
                          <span className="px-3 py-1 rounded-full text-xs font-extrabold bg-cyan-500/15 text-cyan-300 border border-cyan-500/30">
                            {myVehicle.status}
                          </span>
                        </div>

                        <div className="grid grid-cols-3 gap-3 text-center bg-slate-950/90 p-4 rounded-2xl border border-slate-800/80">
                          <div>
                            <span className="text-[11px] text-slate-400 block">Assigned Bay</span>
                            <span className="font-extrabold text-lg text-blue-400">
                              {myVehicle.slot_id || pendingSlot || "—"}
                            </span>
                          </div>
                          <div className="border-x border-slate-800">
                            <span className="text-[11px] text-slate-400 block">Entry Time</span>
                            <span className="font-bold text-sm text-slate-200">
                              {myVehicle.entry_time_str}
                            </span>
                          </div>
                          <div>
                            <span className="text-[11px] text-slate-400 block">Elapsed</span>
                            <span className="font-mono font-bold text-sm text-emerald-400">
                              {formatDuration(liveTimer)}
                            </span>
                          </div>
                        </div>

                        {/* 10-Slot Picker + OK Confirmation Bar */}
                        <div>
                          <div className="flex justify-between items-center mb-2.5">
                            <p className="text-xs font-semibold text-slate-300">
                              {alreadyHasSlot
                                ? `Locked to 1 Slot (${myVehicle.slot_id})`
                                : "Pick 1 Slot (S1–S10) & Press OK:"}
                            </p>
                          </div>

                          {!alreadyHasSlot && pendingSlot && (
                            <div className="mb-3 p-3 rounded-2xl bg-cyan-950/60 border border-cyan-400/60 flex items-center justify-between gap-3">
                              <div className="text-xs">
                                <span className="text-slate-300">Selected Slot: </span>
                                <span className="font-mono font-black text-cyan-300 text-sm">{pendingSlot}</span>
                              </div>
                              <div className="flex gap-2">
                                <button
                                  type="button"
                                  onClick={() => setPendingSlot(null)}
                                  className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 cursor-pointer"
                                >
                                  Cancel
                                </button>
                                <button
                                  type="button"
                                  onClick={handleConfirmSlotOk}
                                  className="px-5 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-xs font-black text-slate-950 shadow-lg cursor-pointer"
                                >
                                  OK
                                </button>
                              </div>
                            </div>
                          )}

                          <div className="grid grid-cols-5 gap-2">
                            {ALL_SLOT_IDS.map((id) => {
                              const s = slots[id] || { id, status: "available" };
                              const isMine = myVehicle.slot_id === id;
                              const isPending = pendingSlot === id;
                              const canClickFree = s.status === "available" && !alreadyHasSlot;

                              return (
                                <button
                                  type="button"
                                  key={id}
                                  disabled={!canClickFree && !isMine && !isPending}
                                  onClick={() => canClickFree && handlePickSlot(id)}
                                  className={`py-3 rounded-xl font-extrabold text-xs border transition-all ${
                                    isMine
                                      ? "bg-blue-600 border-blue-400 text-white shadow-lg shadow-blue-600/30"
                                      : isPending
                                      ? "bg-cyan-500 border-cyan-200 text-slate-950 font-black cursor-pointer"
                                      : canClickFree
                                      ? "bg-emerald-950/50 border-emerald-500/40 text-emerald-300 hover:bg-emerald-600 hover:text-white cursor-pointer"
                                      : "bg-slate-950 border-slate-800 text-slate-600 cursor-not-allowed"
                                  }`}
                                >
                                  {id}
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      </div>

                      {myVehicle.slot_id && (
                        <div className="pt-4 border-t border-slate-800 space-y-3">
                          <div className="flex items-center justify-between bg-slate-950 px-4 py-3 rounded-xl border border-slate-800">
                            <span className="text-xs text-slate-400">Anti-Theft Security Guard</span>
                            <span
                              className={`text-xs font-extrabold flex items-center gap-1.5 ${
                                myVehicle.status === "UNLOCKED"
                                  ? "text-emerald-400"
                                  : "text-amber-400"
                              }`}
                            >
                              {myVehicle.status === "UNLOCKED" ? "🔓 DISARMED" : "🛡️ ARMED"}
                            </span>
                          </div>
                          <button
                            type="button"
                            onClick={handleUnlock}
                            disabled={myVehicle.status === "UNLOCKED"}
                            className={`w-full py-4 rounded-xl font-extrabold text-xs tracking-wide uppercase transition-all shadow-lg ${
                              myVehicle.status === "UNLOCKED"
                                ? "bg-slate-800 text-slate-400 cursor-default"
                                : "bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white shadow-purple-600/25"
                            }`}
                          >
                            {myVehicle.status === "UNLOCKED"
                              ? "✓ Unlocked — Follow Purple Path to Vehicle"
                              : "🔓 Unlock Vehicle to Retrieve"}
                          </button>
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {/* Right 8 Columns: Interactive 10-Slot Car Park Floor Plan */}
                <div className="lg:col-span-8 bg-slate-900/80 border border-slate-800 rounded-3xl p-6 shadow-xl flex flex-col justify-between">
                  <div className="flex flex-wrap justify-between items-center gap-2 mb-4">
                    <div>
                      <h2 className="text-base font-extrabold text-white">
                        Interactive Car Park Floor Plan (10 Slots)
                      </h2>
                      <p className="text-xs text-slate-400">
                        {alreadyHasSlot
                          ? `Navigation active to slot ${myVehicle.slot_id} (1 slot per vehicle)`
                          : pendingSlot
                          ? `Slot ${pendingSlot} selected — press OK to confirm & navigate`
                          : "Click any green slot (S1–S10) then press OK"}
                      </p>
                    </div>
                    <div className="flex flex-wrap gap-4 text-xs font-semibold bg-slate-950 px-4 py-2 rounded-xl border border-slate-800">
                      <span className="flex items-center gap-1.5 text-emerald-400">
                        <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Free
                      </span>
                      <span className="flex items-center gap-1.5 text-amber-400">
                        <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Reserved
                      </span>
                      <span className="flex items-center gap-1.5 text-rose-400">
                        <span className="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Occupied
                      </span>
                      <span className="flex items-center gap-1.5 text-blue-400">
                        <span className="w-2.5 h-2.5 rounded-full bg-blue-500"></span> Yours
                      </span>
                    </div>
                  </div>

                  {/* Parking Lot Canvas */}
                  <div className="relative bg-[#111827] border-2 border-slate-800 rounded-2xl p-5 overflow-hidden flex-1 flex flex-col justify-between">
                    {/* Top Gate Bar */}
                    <div className="flex justify-between items-center mb-4 px-2">
                      <div className="flex items-center gap-2 bg-cyan-950/80 border border-cyan-500/40 px-3.5 py-1.5 rounded-lg">
                        <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
                        <span className="text-xs font-extrabold text-cyan-300 tracking-wider">
                          ENTRY GATE (ALPR CAM 1)
                        </span>
                      </div>
                      <span className="text-xs font-mono text-slate-500">ZONE A (S1–S5) & ZONE B (S6–S10)</span>
                    </div>

                    {/* Main 10-Slot Grid + Central Driving Aisle */}
                    <div className="relative grid grid-cols-12 gap-4 items-stretch min-h-[480px] flex-1">
                      {/* Left Wing: 5 Slots (S1 - S5) */}
                      <div className="col-span-4 flex flex-col justify-between gap-3 relative z-30">
                        {LEFT_IDS.map((id) => renderSlotCard(id))}
                      </div>

                      {/* Center Driving Aisle */}
                      <div className="col-span-4 bg-slate-900/90 rounded-xl border border-dashed border-slate-700/80 flex flex-col items-center justify-between py-5 relative z-10">
                        <span className="text-xs font-bold text-slate-500 tracking-widest uppercase">
                          ↓ Drive Lane
                        </span>
                        <div className="h-full w-0.5 border-l-2 border-dashed border-slate-700 my-3"></div>
                        <span className="text-xs font-bold text-slate-500 tracking-widest uppercase">
                          Pedestrian Walk ↑
                        </span>
                      </div>

                      {/* Right Wing: 5 Slots (S6 - S10) */}
                      <div className="col-span-4 flex flex-col justify-between gap-3 relative z-30">
                        {RIGHT_IDS.map((id) => renderSlotCard(id))}
                      </div>

                      {/* SVG Navigation Line Overlay */}
                      <svg
                        viewBox="0 0 400 480"
                        preserveAspectRatio="none"
                        className="absolute inset-0 w-full h-full pointer-events-none z-40"
                      >
                        {renderNavigationPath()}
                      </svg>
                    </div>

                    {/* Bottom Exit & Kiosk Bar */}
                    <div className="flex justify-between items-center mt-4 px-2">
                      <div className="flex items-center gap-2 bg-rose-950/80 border border-rose-500/40 px-3.5 py-1.5 rounded-lg">
                        <span className="text-xs font-extrabold text-rose-300 tracking-wider">
                          EXIT GATE (BILLING)
                        </span>
                      </div>
                      <div className="flex items-center gap-1.5 bg-purple-950/80 border border-purple-500/40 px-3.5 py-1.5 rounded-lg">
                        <span className="text-xs font-bold text-purple-300">
                          🚶 Pedestrian Lobby
                        </span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ADMIN & HARDWARE SIMULATOR TAB */}
            {tab === "admin" && (
              <div className="w-full grid md:grid-cols-2 gap-6">
                <div className="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 space-y-5 shadow-xl">
                  <div>
                    <h2 className="text-lg font-extrabold text-amber-400">
                      Hardware & Camera Event Simulator
                    </h2>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Trigger live ESP32 IR/PIR sensor events and ALPR camera scans for all 10 bays.
                    </p>
                  </div>

                  {/* 1. Entry & Exit Camera */}
                  <div className="bg-slate-950/90 border border-slate-800 p-4 rounded-2xl space-y-3">
                    <label className="text-xs font-bold text-cyan-400 uppercase tracking-wider block">
                      1. Gate ALPR Camera (Entry / Exit)
                    </label>
                    <div className="flex gap-2">
                      <input
                        value={simPlate}
                        onChange={(e) => setSimPlate(e.target.value)}
                        className="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm font-mono flex-1"
                      />
                      <select
                        value={simType}
                        onChange={(e) => setSimType(e.target.value)}
                        className="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm"
                      >
                        <option>Car</option>
                        <option>Van</option>
                        <option>SUV</option>
                        <option>Bike</option>
                      </select>
                    </div>
                    <div className="grid grid-cols-2 gap-2.5">
                      <button
                        onClick={() =>
                          postApi("/api/gate/entry-scan", { plate: simPlate, vehicle_type: simType })
                        }
                        className="bg-cyan-600 hover:bg-cyan-500 py-3 rounded-xl text-xs font-extrabold"
                      >
                        📷 Entry Gate Scan
                      </button>
                      <button
                        onClick={() =>
                          postApi("/api/gate/exit-scan", { plate: simPlate, vehicle_type: simType })
                        }
                        className="bg-rose-600 hover:bg-rose-500 py-3 rounded-xl text-xs font-extrabold"
                      >
                        🧾 Exit Gate & Bill
                      </button>
                    </div>
                  </div>

                  {/* 2. Slot IR + Overhead Verification */}
                  <div className="bg-slate-950/90 border border-slate-800 p-4 rounded-2xl space-y-3">
                    <label className="text-xs font-bold text-emerald-400 uppercase tracking-wider block">
                      2. Bay IR Sensor & Overhead Plate Check (S1–S10)
                    </label>
                    <div className="flex gap-2">
                      <select
                        value={simSlot}
                        onChange={(e) => setSimSlot(e.target.value)}
                        className="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm font-bold"
                      >
                        {ALL_SLOT_IDS.map((id) => (
                          <option key={id} value={id}>
                            Bay {id}
                          </option>
                        ))}
                      </select>
                      <input
                        value={simActualPlate}
                        onChange={(e) => setSimActualPlate(e.target.value)}
                        placeholder="Detected Plate in Bay"
                        className="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm font-mono flex-1"
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-2.5">
                      <button
                        onClick={() =>
                          postApi("/api/sensors/slot-update", {
                            slot_id: simSlot,
                            ir_occupied: true,
                            detected_plate: simActualPlate,
                          })
                        }
                        className="bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl text-xs font-extrabold"
                      >
                        🚘 Park Vehicle (IR = 1)
                      </button>
                      <button
                        onClick={() =>
                          postApi("/api/sensors/slot-update", {
                            slot_id: simSlot,
                            ir_occupied: false,
                          })
                        }
                        className="bg-slate-700 hover:bg-slate-600 py-3 rounded-xl text-xs font-extrabold"
                      >
                        ⬆️ Vacate Bay (IR = 0)
                      </button>
                    </div>
                  </div>

                  {/* 3. Security Anti-Theft Trigger */}
                  <div className="bg-slate-950/90 border border-red-900/50 p-4 rounded-2xl space-y-3">
                    <label className="text-xs font-bold text-red-400 uppercase tracking-wider block">
                      3. Anti-Theft PIR / YOLO Human Loitering
                    </label>
                    <button
                      onClick={() =>
                        postApi("/api/security/loitering", {
                          slot_id: simSlot,
                          human_loitering: true,
                        })
                      }
                      className="w-full bg-red-600 hover:bg-red-500 py-3.5 rounded-xl text-xs font-extrabold shadow-lg shadow-red-600/20"
                    >
                      🚨 Trigger Suspicious Human Around {simSlot}
                    </button>
                  </div>
                </div>

                {/* Right Column: Live Security Audit Feed */}
                <div className="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 shadow-xl">
                  <h2 className="text-lg font-extrabold text-white mb-1">
                    Security & Violation Audit Log
                  </h2>
                  <p className="text-xs text-slate-400 mb-4">
                    Real-time wrong-slot parking and unauthorized perimeter intrusion alerts.
                  </p>
                  <div className="space-y-3 max-h-[480px] overflow-y-auto pr-1">
                    {alerts.length === 0 ? (
                      <div className="text-center py-16 bg-slate-950/60 rounded-2xl border border-slate-800/60">
                        <p className="text-3xl mb-2">🛡️</p>
                        <p className="text-sm text-slate-400">
                          All 10 parking bays are secure. No violations detected.
                        </p>
                      </div>
                    ) : (
                      alerts.map((a) => (
                        <div
                          key={a.id}
                          className={`p-4 rounded-2xl border text-xs ${
                            a.level === "CRITICAL"
                              ? "bg-red-950/60 border-red-500/50 text-red-100"
                              : "bg-amber-950/60 border-amber-500/50 text-amber-100"
                          }`}
                        >
                          <div className="flex justify-between font-extrabold mb-1">
                            <span>
                              {a.level === "CRITICAL" ? "🚨" : "⚠️"} {a.title}
                            </span>
                            <span className="font-mono opacity-75">{a.time}</span>
                          </div>
                          <p className="opacity-90 leading-relaxed">{a.message}</p>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
